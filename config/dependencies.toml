# External engines are NOT vendored. The project calls them through adapters.
# Pin revisions in your local deployment once validated.

[comfyui]
url = "https://github.com/Comfy-Org/ComfyUI"
role = "local image workflow renderer"
bundled = false
license = "verify upstream at selected revision"

[comfy_mcp]
url = "https://github.com/Comfy-Org/comfy-mcp"
role = "optional external ComfyUI MCP; this repo also exposes its own MCP"
bundled = false
license = "verify upstream at selected revision"

[controlnet_aux]
url = "https://github.com/Fannovel16/comfyui_controlnet_aux"
role = "DWPose/OpenPose preprocessing for ComfyUI"
bundled = false
license = "verify upstream at selected revision"

[dwpose]
url = "https://github.com/IDEA-Research/DWPose"
role = "whole-body pose estimation"
bundled = false
license = "Apache-2.0"

[mediapipe]
url = "https://github.com/google-ai-edge/mediapipe"
role = "face landmarks, blendshapes and head transform"
bundled = false
license = "Apache-2.0"

[practical_rife]
url = "https://github.com/hzwer/Practical-RIFE"
role = "frame interpolation"
bundled = false
license = "MIT"

[ffmpeg]
url = "https://ffmpeg.org/"
role = "decode and encode"
bundled = false
license = "see upstream build configuration"

[ipadapter_plus]
url = "https://github.com/cubiq/ComfyUI_IPAdapter_plus"
role = "appearance consistency between generated frames"
bundled = false
license = "verify upstream at selected revision"

[instantid]
url = "https://github.com/instantX-research/InstantID"
role = "identity lock for the target dancer"
bundled = false
license = "verify upstream at selected revision"

# Sister modules — consume, do not vendor.

[contemporary_studio_dance]
url = "https://github.com/sophiamaybea/contemporary-studio-dance"
role = "movement vocabulary, kinematics, style critic"
bundled = false
license = "verify in that repo"

# Architecture references only. Do not copy source.

[framefold]
url = "https://github.com/RainerBracharz/framefold"
role = "study-only pipeline shape: sample, score, rest-detect, filter, dedupe, review, stabilize, assemble"
bundled = false
license = "not a reuse grant — architecture only"
