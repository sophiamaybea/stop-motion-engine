[project]
name = "stop-motion-engine"
version = "0.1.0"
description = "Compose stop-motion and reverse-engineer motion cells from video."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sophiamaybea" }]
dependencies = ["numpy>=1.24", "pillow>=10.0"]

[project.scripts]
stop-motion-engine = "stop_motion_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
